<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Hobbies</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --bg:#1e1e2e; --panel:#2a2a3d; --accent:#7aa2f7; --text:#e0e0e0; --muted:#9a9ab0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px; text-align:center; background:var(--panel); border-bottom:2px solid var(--accent);
            display:flex; justify-content:space-between; align-items:center; gap:10px; }
  header .title-block { text-align:left; }
  header h1 { margin:0; font-size:1.2em; }
  #edit-mode-btn { padding:8px 12px; border:none; border-radius:8px; background:#3a3a52; color:var(--text); cursor:pointer; font-size:0.85em; flex-shrink:0; }
  #edit-mode-btn.on { background:#f54242; color:#fff; font-weight:bold; }
  .container { display:flex; flex-direction:column; gap:16px; padding:14px; }

  .buttons { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .cat-btn-wrap { position:relative; }
  .cat-btn { width:100%; padding:12px 10px; border:none; border-radius:10px; background:var(--panel); color:var(--text);
             font-size:0.9em; text-align:left; cursor:pointer; border-left:5px solid var(--accent);
             min-height:60px; display:flex; align-items:center; gap:8px; line-height:1.2; }
  .cat-btn .emoji { font-size:1.6em; flex-shrink:0; }
  .cat-btn.active { background:var(--accent); color:#14141f; font-weight:bold; }
  .cat-del-btn { position:absolute; top:-6px; right:-6px; background:#f54242; color:#fff; border:none;
                 border-radius:50%; width:24px; height:24px; font-size:0.8em; cursor:pointer; z-index:2; }
  .cat-edit-btn { position:absolute; top:-6px; left:-6px; background:var(--accent); color:#14141f; border:none;
                 border-radius:50%; width:24px; height:24px; font-size:0.8em; cursor:pointer; z-index:2; }
  .add-cat-btn { padding:12px 10px; border:2px dashed var(--muted); border-radius:10px; background:transparent; color:var(--muted);
             font-size:0.9em; text-align:center; cursor:pointer; min-height:60px; display:flex; align-items:center; justify-content:center; }

  .details { background:var(--panel); border-radius:12px; padding:16px; min-height:120px; }
  .details.hidden { display:none; }
  .details h2 { margin-top:0; color:var(--accent); font-size:1.1em; }
  .item-list { list-style:none; padding:0; margin:0 0 12px 0; }
  .item-list li { display:flex; align-items:center; justify-content:space-between; gap:8px;
                  background:#14141f; border-radius:8px; padding:10px 12px; margin-bottom:6px; border-left:3px solid var(--muted); }
  .item-list li .item-actions { display:flex; gap:6px; flex-shrink:0; }
  .item-list li .edit-btn, .item-list li .del-btn { border:none; border-radius:6px; padding:4px 9px; cursor:pointer; font-size:0.8em; }
  .item-list li .edit-btn { background:#3a3a52; color:var(--text); }
  .item-list li .del-btn { background:#f54242; color:#fff; }
  .item-list li input { flex:1; padding:6px; border-radius:6px; border:1px solid #444; background:#1e1e2e; color:var(--text); }
  .add-row { display:flex; gap:6px; }
  .add-row input { flex:1; padding:10px; border-radius:8px; border:1px solid #444; background:#14141f; color:var(--text); font-size:0.95em; }
  .add-row button { padding:10px 14px; border:none; border-radius:8px; background:var(--accent); color:#14141f; font-weight:bold; cursor:pointer; }
  .hint { color:var(--muted); font-size:0.8em; margin-top:8px; }

  .notes-section { padding:16px; background:var(--panel); border-radius:12px; }
  #notepad-toggle-btn { width:100%; text-align:left; background:none; border:none; color:var(--accent);
             font-size:1.1em; font-weight:bold; cursor:pointer; padding:0; display:flex; align-items:center; gap:8px; }
  #notepad-toggle-btn .chevron { font-size:0.8em; color:var(--muted); margin-left:auto; }
  .notepad-body { margin-top:12px; }
  .notepad-body.hidden { display:none; }
  .toolbar { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .toolbar button { padding:9px 10px; border:none; border-radius:6px; cursor:pointer; font-size:0.85em; background:#3a3a52; color:var(--text); }
  .swatch-yellow { background:#f5e642 !important; color:#222 !important; }
  .swatch-red { background:#f54242 !important; color:#fff !important; }
  .swatch-green { background:#42f56f !important; color:#222 !important; }
  .swatch-clear { background:#666 !important; }
  #notepad { width:100%; min-height:150px; background:#14141f; color:var(--text); border:1px solid #444;
             border-radius:8px; padding:12px; font-size:1em; line-height:1.5; outline:none; }
  mark.yellow { background:#f5e642; color:#222; cursor:pointer; } mark.red { background:#f54242; color:#fff; cursor:pointer; } mark.green { background:#42f56f; color:#222; cursor:pointer; }
  .save-status { margin-top:8px; font-size:0.85em; color:var(--muted); }

  .drive-section { padding:16px; background:var(--panel); border-radius:12px; }
  .drive-section h2 { color:var(--accent); margin-top:0; font-size:1.1em; }
  #authorize_button, #sync_button { padding:12px 16px; border:none; border-radius:8px; background:var(--accent);
             color:#14141f; font-weight:bold; font-size:1em; cursor:pointer; width:100%; margin-top:8px; }
  #sync_button:disabled { background:#555; color:#aaa; cursor:not-allowed; }
  #status { margin-top:10px; font-size:0.85em; color:var(--muted); }
  .config-box { background:#14141f; border-radius:8px; padding:12px; margin-bottom:10px; }
  .config-box label { font-size:0.85em; color:var(--muted); display:block; margin-bottom:4px; }
  .config-box input { width:100%; padding:8px; border-radius:6px; border:1px solid #444; background:#1e1e2e; color:var(--text); }
  footer { text-align:center; padding:12px; color:var(--muted); font-size:0.75em; }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>Mes Hobbies</h1>
  </div>
  <button id="edit-mode-btn" onclick="toggleEditMode()">✏️ Édition</button>
</header>

<div class="container">
  <div class="buttons" id="btn-container"></div>

  <div class="details hidden" id="details-panel"></div>

  <div class="notes-section">
    <button id="notepad-toggle-btn" onclick="toggleNotepad()">
      <span>📝 Bloc-notes</span>
      <span class="chevron" id="notepad-chevron">▼</span>
    </button>
    <div class="notepad-body hidden" id="notepad-body">
      <div class="toolbar">
        <button onclick="toggleCase('upper')">MAJ</button>
        <button onclick="toggleCase('lower')">min</button>
        <button class="swatch-yellow" onclick="highlight('yellow')">Jaune</button>
        <button class="swatch-red" onclick="highlight('red')">Rouge</button>
        <button class="swatch-green" onclick="highlight('green')">Vert</button>
        <button class="swatch-clear" onclick="clearHighlight()">Effacer</button>
      </div>
      <div id="notepad" contenteditable="true"></div>
      <div class="save-status" id="save-status">Astuce : touchez un mot surligné pour retirer sa couleur.</div>
    </div>
  </div>

  <div class="drive-section">
    <h2>☁️ Google Drive</h2>
    <div class="config-box">
      <label>Client ID Google (voir instructions fournies)</label>
      <input type="text" id="client_id" placeholder="xxxxxxxxxx.apps.googleusercontent.com">
    </div>
    <button id="authorize_button" onclick="handleAuth()">Se connecter à Google Drive</button>
    <button id="sync_button" onclick="syncAllToDrive()" disabled>Tout synchroniser vers Google Drive</button>
    <div id="status">Non connecté.</div>
  </div>
</div>

<footer>Vos catégories, éléments et notes sont sauvegardés localement, puis sur Drive</footer>

<script>
const defaultCategories = [
  { id:"tech", emoji:"💻", label:"Technologie et informatique", items:["IA, ordinateurs quantiques, puissance de calcul","Téléphone portable pliable","Administration Linux (Lubuntu, Plasma X11)","Réseau, WiFi 6, optimisation","Développement web (HTML/JS, PWA)","LLM en local (Ollama, LM Studio)"] },
  { id:"sciences", emoji:"🔬", label:"Sciences fondamentales et spatial", items:["Atomes, molécules, photons, électrons","Physique quantique","Domaine spatial","Contenus scientifiques et tutoriels techniques"] },
  { id:"nature", emoji:"🌱", label:"Nature, vivant et jardin technologique", items:["Animaux, insectes","Le végétal","Panneau solaire, pompe à chaleur","Puits canadien ou provençal","Rénovation et amélioration de l'habitat"] },
  { id:"finance", emoji:"💰", label:"Finance et économie", items:["Bourse, placements","Startups, bitcoin","Intérêt composé"] },
  { id:"memoire", emoji:"🧠", label:"Cerveau, mémoire et apprentissage", items:["Techniques de mémorisation","Mentalistes, champions de mémoire","Auto-formation Linux et web"] },
  { id:"bricolage", emoji:"🔧", label:"Bricolage, astuces et réparation", items:["Génie de la réparation (astuces africaines)","Trucs et astuces pratiques","Dépannage technologique","Entretien domestique et laverie"] },
  { id:"manuel", emoji:"✂️", label:"Travaux manuels et pliage", items:["Les nœuds","Pliage de vêtements et serviettes","Origami papier","Photographie et traitement d'image"] }
];

const CATS_KEY = 'hobby_categories_v2';
let categories = [];
let currentCatId = null;
let editMode = false;

function loadCategories() {
  const raw = localStorage.getItem(CATS_KEY);
  if (raw) {
    categories = JSON.parse(raw);
  } else {
    categories = JSON.parse(JSON.stringify(defaultCategories));
    saveCategories();
  }
}
function saveCategories() {
  localStorage.setItem(CATS_KEY, JSON.stringify(categories));
}

const btnContainer = document.getElementById('btn-container');
const detailsPanel = document.getElementById('details-panel');
const notepad = document.getElementById('notepad');
const saveStatus = document.getElementById('save-status');
const editModeBtn = document.getElementById('edit-mode-btn');
const notepadBody = document.getElementById('notepad-body');
const notepadChevron = document.getElementById('notepad-chevron');

function toggleNotepad() {
  const isHidden = notepadBody.classList.contains('hidden');
  if (isHidden) {
    notepadBody.classList.remove('hidden');
    notepadChevron.textContent = '▲';
  } else {
    notepadBody.classList.add('hidden');
    notepadChevron.textContent = '▼';
  }
}

function toggleEditMode() {
  editMode = !editMode;
  editModeBtn.classList.toggle('on', editMode);
  renderButtons();
  renderDetails();
}

function renderButtons() {
  btnContainer.innerHTML = '';
  categories.forEach(cat => {
    const wrap = document.createElement('div');
    wrap.className = 'cat-btn-wrap';

    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat.id === currentCatId ? ' active' : '');
    btn.innerHTML = `<span class="emoji">${cat.emoji}</span><span>${escapeHtml(cat.label)}</span>`;
    btn.onclick = () => selectCategory(cat.id);
    wrap.appendChild(btn);

    if (editMode) {
      const editBtn = document.createElement('button');
      editBtn.className = 'cat-edit-btn';
      editBtn.textContent = '✏️';
      editBtn.onclick = (e) => { e.stopPropagation(); editCategory(cat.id); };
      wrap.appendChild(editBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'cat-del-btn';
      delBtn.textContent = '✕';
      delBtn.onclick = (e) => { e.stopPropagation(); deleteCategory(cat.id); };
      wrap.appendChild(delBtn);
    }
    btnContainer.appendChild(wrap);
  });

  if (editMode) {
    const addBtn = document.createElement('button');
    addBtn.className = 'add-cat-btn';
    addBtn.textContent = '➕ Ajouter une catégorie';
    addBtn.onclick = addCategory;
    btnContainer.appendChild(addBtn);
  }
}

function addCategory() {
  const label = prompt("Nom de la nouvelle catégorie :");
  if (!label || !label.trim()) return;
  const emoji = prompt("Emoji pour cette catégorie (ex: 🎯) :", "⭐") || "⭐";
  const id = 'cat_' + Date.now();
  categories.push({ id, emoji: emoji.trim(), label: label.trim(), items: [] });
  saveCategories();
  renderButtons();
  selectCategory(id);
}

function editCategory(catId) {
  const cat = categories.find(c => c.id === catId);
  if (!cat) return;
  const newLabel = prompt("Modifier le nom de la catégorie :", cat.label);
  if (newLabel === null) return;
  const newEmoji = prompt("Modifier l'emoji de la catégorie :", cat.emoji);
  if (newEmoji === null) return;
  if (newLabel.trim()) cat.label = newLabel.trim();
  if (newEmoji.trim()) cat.emoji = newEmoji.trim();
  saveCategories();
  renderButtons();
  if (currentCatId === catId) renderDetails();
}

function deleteCategory(catId) {
  const cat = categories.find(c => c.id === catId);
  if (!cat) return;
  if (!confirm(`Supprimer la catégorie "${cat.label}" et tout son contenu ?`)) return;
  categories = categories.filter(c => c.id !== catId);
  saveCategories();
  if (currentCatId === catId) {
    currentCatId = null;
  }
  renderButtons();
  renderDetails();
}

function selectCategory(catId) {
  currentCatId = (currentCatId === catId) ? null : catId;
  renderButtons();
  renderDetails();
}

function renderDetails() {
  const cat = categories.find(c => c.id === currentCatId);
  if (!cat) {
    detailsPanel.classList.add('hidden');
    detailsPanel.innerHTML = '';
    return;
  }
  detailsPanel.classList.remove('hidden');

  let html = `<h2>${cat.emoji} ${escapeHtml(cat.label)}</h2><ul class="item-list">`;
  cat.items.forEach((item, idx) => {
    html += `<li id="item-${idx}">
      <span class="item-text">${escapeHtml(item)}</span>
      ${editMode ? `<span class="item-actions">
        <button class="edit-btn" onclick="editItem(${idx})">✏️</button>
        <button class="del-btn" onclick="deleteItem(${idx})">✕</button>
      </span>` : ''}
    </li>`;
  });
  html += `</ul>`;
  html += `<div class="add-row">
              <input type="text" id="new-item-input" placeholder="Ajouter un élément à cette catégorie...">
              <button onclick="addItem()">Ajouter</button>
            </div>`;
  detailsPanel.innerHTML = html;

  const input = document.getElementById('new-item-input');
  if (input) {
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') addItem(); });
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getCurrentCat() {
  return categories.find(c => c.id === currentCatId);
}

function addItem() {
  const input = document.getElementById('new-item-input');
  const value = input.value.trim();
  if (!value) return;
  const cat = getCurrentCat();
  cat.items.push(value);
  saveCategories();
  renderDetails();
}

function deleteItem(idx) {
  const cat = getCurrentCat();
  cat.items.splice(idx, 1);
  saveCategories();
  renderDetails();
}

function editItem(idx) {
  const cat = getCurrentCat();
  const li = document.getElementById('item-' + idx);
  const currentText = cat.items[idx];
  li.innerHTML = `<input type="text" id="edit-input-${idx}" value="${escapeHtml(currentText)}">
    <span class="item-actions"><button class="edit-btn" onclick="saveEditItem(${idx})">✔</button></span>`;
  const editInput = document.getElementById('edit-input-' + idx);
  editInput.focus();
  editInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveEditItem(idx); });
}

function saveEditItem(idx) {
  const cat = getCurrentCat();
  const editInput = document.getElementById('edit-input-' + idx);
  const value = editInput.value.trim();
  if (value) cat.items[idx] = value;
  saveCategories();
  renderDetails();
}

// --- Bloc-notes libre ---
window.addEventListener('load', () => {
  loadCategories();
  currentCatId = null;
  renderButtons();
  renderDetails();

  const saved = localStorage.getItem('hobby_freenotes');
  if (saved) notepad.innerHTML = saved;
  const savedClientId = localStorage.getItem('gdrive_client_id');
  if (savedClientId) document.getElementById('client_id').value = savedClientId;
});

notepad.addEventListener('input', () => {
  fixMarkLeak();
  localStorage.setItem('hobby_freenotes', notepad.innerHTML);
  saveStatus.textContent = 'Enregistré ✓ (' + new Date().toLocaleTimeString('fr-FR') + ')';
});

notepad.addEventListener('click', (e) => {
  const mark = e.target.closest('mark');
  if (mark) {
    const parent = mark.parentNode;
    while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);
    localStorage.setItem('hobby_freenotes', notepad.innerHTML);
    saveStatus.textContent = 'Surlignage retiré ✓';
  }
});

function fixMarkLeak() {
  const sel = window.getSelection();
  if (!sel.rangeCount || !sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const node = range.startContainer;
  if (node.nodeType !== 3) return;
  const markEl = node.parentElement && node.parentElement.closest ? node.parentElement.closest('mark') : null;
  if (!markEl || markEl.dataset.lockedLen === undefined) return;

  const lockedLen = parseInt(markEl.dataset.lockedLen, 10);
  const currentText = markEl.textContent;
  if (currentText.length <= lockedLen) return;

  const kept = currentText.slice(0, lockedLen);
  const leaked = currentText.slice(lockedLen);
  markEl.textContent = kept;

  let plainNode = markEl.nextSibling;
  if (!(plainNode && plainNode.nodeType === 3)) {
    plainNode = document.createTextNode('');
    markEl.parentNode.insertBefore(plainNode, markEl.nextSibling);
  }
  plainNode.textContent = leaked + plainNode.textContent;

  const newRange = document.createRange();
  newRange.setStart(plainNode, leaked.length);
  newRange.collapse(true);
  sel.removeAllRanges();
  sel.addRange(newRange);
}

function placeCaretAfter(node) {
  const spacer = document.createTextNode('\u200B');
  if (node.nextSibling) {
    node.parentNode.insertBefore(spacer, node.nextSibling);
  } else {
    node.parentNode.appendChild(spacer);
  }
  const sel = window.getSelection();
  const newRange = document.createRange();
  newRange.setStart(spacer, 1);
  newRange.collapse(true);
  sel.removeAllRanges();
  sel.addRange(newRange);
  notepad.focus();
}

function toggleCase(mode) {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) { alert("Sélectionnez du texte d'abord."); return; }
  const range = sel.getRangeAt(0);
  const text = range.toString();
  const newText = mode === 'upper' ? text.toUpperCase() : text.toLowerCase();
  const span = document.createElement('span');
  span.textContent = newText;
  range.deleteContents();
  range.insertNode(span);
  placeCaretAfter(span);
  localStorage.setItem('hobby_freenotes', notepad.innerHTML);
}

function highlight(color) {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) { alert("Sélectionnez du texte d'abord."); return; }
  const range = sel.getRangeAt(0);
  const mark = document.createElement('mark');
  mark.className = color;
  mark.title = "Touchez pour retirer le surlignage";
  mark.appendChild(range.extractContents());
  mark.dataset.lockedLen = mark.textContent.length;
  range.insertNode(mark);
  placeCaretAfter(mark);
  localStorage.setItem('hobby_freenotes', notepad.innerHTML);
}

function clearHighlight() {
  notepad.querySelectorAll('mark').forEach(mark => {
    const parent = mark.parentNode;
    while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);
  });
  localStorage.setItem('hobby_freenotes', notepad.innerHTML);
  saveStatus.textContent = 'Tous les surlignages ont été retirés ✓';
}

// --- Google Drive Sync ---
let accessToken = null;
const SCOPES = "https://www.googleapis.com/auth/drive.file";

function handleAuth() {
  const clientId = document.getElementById('client_id').value.trim();
  if (!clientId) { alert("Merci de coller votre Client ID Google d'abord."); return; }
  localStorage.setItem('gdrive_client_id', clientId);

  const client = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: SCOPES,
    callback: (response) => {
      if (response.access_token) {
        accessToken = response.access_token;
        document.getElementById('status').textContent = "Connecté à Google Drive.";
        document.getElementById('sync_button').disabled = false;
      }
    },
  });
  client.requestAccessToken();
}

async function driveFetch(url, options = {}) {
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + accessToken });
  const res = await fetch(url, options);
  return res.json();
}

async function findOrCreateFolder(name, parentId) {
  const q = encodeURIComponent(`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`);
  const search = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  if (search.files && search.files.length > 0) return search.files[0].id;
  const meta = { name, mimeType: 'application/vnd.google-apps.folder', parents: [parentId] };
  const created = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(meta)
  });
  return created.id;
}

async function findFileInFolder(name, folderId) {
  const q = encodeURIComponent(`name='${name.replace(/'/g,"\\'")}' and '${folderId}' in parents and trashed=false`);
  const search = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  return (search.files && search.files.length > 0) ? search.files[0].id : null;
}

async function createDocInFolder(name, content, folderId) {
  const boundary = '-------314159265358979323846';
  const metadata = { name, mimeType: 'application/vnd.google-apps.document', parents: [folderId] };
  const multipartBody =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: text/html; charset=UTF-8\r\n\r\n${content}\r\n--${boundary}--`;
  return driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST',
    headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
    body: multipartBody
  });
}

async function updateDocContent(fileId, content) {
  return driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'text/html; charset=UTF-8' },
    body: content
  });
}

async function upsertDocInFolder(name, content, folderId) {
  const existingId = await findFileInFolder(name, folderId);
  if (existingId) {
    await updateDocContent(existingId, content);
  } else {
    await createDocInFolder(name, content, folderId);
  }
}

async function syncAllToDrive() {
  const statusEl = document.getElementById('status');
  statusEl.textContent = "Synchronisation en cours...";
  try {
    const rootId = await findOrCreateFolder('Mes Hobbies', 'root');

    for (const cat of categories) {
      const folderId = await findOrCreateFolder(cat.label, rootId);
      const htmlContent = `<h1>${cat.emoji} ${cat.label}</h1><ul>${cat.items.map(i => `<li>${i}</li>`).join('') || '<li>(aucun élément)</li>'}</ul>`;
      await upsertDocInFolder(cat.label, htmlContent, folderId);
    }

    const freeNotes = localStorage.getItem('hobby_freenotes') || '<p>(vide)</p>';
    const notesHtml = `<h1>📝 Bloc-notes</h1>${freeNotes}`;
    await upsertDocInFolder('Bloc-notes', notesHtml, rootId);

    statusEl.textContent = "Synchronisation terminée ! Toutes vos catégories et le Bloc-notes sont à jour sur Drive.";
  } catch (e) {
    statusEl.textContent = "Erreur pendant la synchronisation : " + e.message;
  }
}
</script>
